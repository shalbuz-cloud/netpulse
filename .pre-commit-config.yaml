# Install: uv run pre-commit install --hook-type pre-commit --hook-type pre-push
# Run all:  uv run pre-commit run --all-files
# https://pre-commit.com

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [ python ]
        stages: [ pre-commit ]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [ python ]
        stages: [ pre-commit ]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [ python ]
        pass_filenames: false
#        args: [ --config-file=pyproject.toml, "src", "tests" ]
        stages: [ pre-commit ]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [ pre-push ]
