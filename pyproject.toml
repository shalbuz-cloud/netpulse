[project]
name = "netpulse"
version = "0.1.0"
description = "CLI benchmark tool for measuring download speed"
readme = "README.md"
authors = [
    { name = "shalbuz", email = "shalbuz.mursalov@gmail.com" }
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "rich>=15.0.0,<16.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.16.5,<1.0.0",
]

[project.scripts]
netpulse = "netpulse:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Use of `assert` detected (standard for pytest)
    "ARG001", # Unused function arguments (allowed for pytest fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["netpulse"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["netpulse"]
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=netpulse"
